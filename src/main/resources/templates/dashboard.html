<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring Batch Monitor</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div><p class="eyebrow">SPRING BATCH</p><h1>Execution monitor</h1></div><button id="refresh">Refresh</button></header>
<main><section class="cards"><div><span>Total executions</span><strong id="total">—</strong></div><div><span>Completed</span><strong id="completed">—</strong></div><div><span>Failed</span><strong id="failed">—</strong></div><div><span>Running</span><strong id="running">—</strong></div></section>
<section class="panel"><div class="toolbar"><h2>Jobs</h2><button id="launch">Launch selected job</button></div><div id="jobs" class="jobs"></div><p class="hint">Launch parameters are optional JSON, for example <code>{&quot;businessDate&quot;:&quot;2026-09-29&quot;}</code>.</p><input id="params" class="params" placeholder="{}" value="{}"></section>
<section class="panel"><div class="toolbar"><h2>Recent executions</h2><select id="status"><option value="">All statuses</option><option>COMPLETED</option><option>FAILED</option><option>STARTED</option><option>STOPPED</option></select></div><div class="table-wrap"><table><thead><tr><th>Job</th><th>Execution</th><th>Status</th><th>Started</th><th>Ended</th><th>Exit code</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<aside id="detail" class="detail hidden"><button class="close" onclick="closeDetail()">×</button><div id="detailContent"></div></aside></main><script src="/app.js"></script></body></html>
